name: Cloud Backend Open Tool

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run backend smoke checks after startup"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  open-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asset_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asset_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/asset_management
      SECRET_KEY: ci-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Password hashing sanity
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}/backend" python - <<'PY'
          from app.core.security import get_password_hash, verify_password
          h = get_password_hash('Admin@123')
          assert verify_password('Admin@123', h)
          print('password hashing sanity ok')
          PY
      - name: Wait for postgres
        run: |
          python - <<'PY'
          import time
          import psycopg2

          deadline = time.time() + 120
          while time.time() < deadline:
              try:
                  conn = psycopg2.connect(dbname='asset_management', user='postgres', password='postgres', host='localhost', port=5432)
                  conn.close()
                  print('postgres ready')
                  raise SystemExit(0)
              except Exception:
                  time.sleep(2)

          raise SystemExit('postgres was not ready in time')
          PY

      - name: Prepare schema
        run: |
          set -o pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/backend" python "${GITHUB_WORKSPACE}/backend/scripts/ci_prepare_db.py" 2>&1 | tee /tmp/alembic.log

      - name: Seed sample data
        working-directory: backend
        run: python seed.py

      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for health
        run: |
          for i in {1..35}; do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo 'health check failed' >&2
          exit 1

      - name: Optional smoke script
        if: ${{ inputs.run_smoke == 'true' }}
        run: bash -x scripts/cloud_backend_smoke.sh

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Cloud Backend Open Tool"
            echo "- Backend started in GitHub runner and health checked."
            echo "- This runner is ephemeral and not internet-exposed; use logs/artifacts for validation."
            echo "- Trigger this workflow from Actions whenever you want a cloud-run verification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump logs
        if: always()
        run: |
          echo "==== alembic.log ===="
          cat /tmp/alembic.log || true
          echo "==== api.log ===="
          cat /tmp/api.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-open-tool-logs
          if-no-files-found: warn
          path: |
            /tmp/alembic.log
            /tmp/api.log
