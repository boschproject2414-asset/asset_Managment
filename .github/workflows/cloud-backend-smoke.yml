name: Cloud Backend Smoke

on:
  workflow_dispatch:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asset_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asset_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/asset_management
      SECRET_KEY: ci-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment info
        run: |
          python --version
          pip --version
          echo "DATABASE_URL=${DATABASE_URL}"

      - name: Wait for postgres
        run: |
          python - <<'PY'
          import time
          import psycopg2

          deadline = time.time() + 60
          last_error = None
          while time.time() < deadline:
              try:
                  conn = psycopg2.connect(dbname='asset_management', user='postgres', password='postgres', host='localhost', port=5432)
                  conn.close()
                  print('Postgres is ready')
                  raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)

          print(f'Postgres did not become ready: {last_error}')
          raise SystemExit(1)
          PY

      - name: Alembic migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Seed data
        working-directory: backend
        run: python seed.py

      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "API health endpoint did not become ready in time" >&2
          exit 1

      - name: Auth and business smoke test
        run: bash -x scripts/cloud_backend_smoke.sh

      - name: Dump API log
        if: always()
        run: |
          echo "==== /tmp/api.log ===="
          cat /tmp/api.log || true

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/api.log
